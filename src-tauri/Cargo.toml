[package]
name = "modbus-studio"
version = "0.1.0"
description = "Cross-platform Modbus master test tool and slave simulator"
authors = ["Modbus Studio Contributors"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
name = "modbus_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-serial = "5"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
